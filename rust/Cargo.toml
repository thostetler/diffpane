[package]
name = "diffpane"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Review a git diff in your browser, comment on the lines, hand the feedback back to your agent."
repository = "https://github.com/thostetler/diffpane"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
fastrand = "2.5.0"
gix = { version = "0.87.1", features = ["blob-diff", "status", "attributes", "worktree-mutation", "dirwalk"] }
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "cookies"] }
tempfile = "3.27.0"
