<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>diffpane</title>
    <!-- .ico first, SVG second: Chrome takes the last usable declaration, and
         the SVG stays crisp at any tab or bookmark size. -->
    <link rel="icon" href="/assets/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <!-- No aria-live here: render() replaces the whole subtree, which would
         re-announce the entire page on every save. The error banner and the
         composer error carry role="alert" instead. -->
    <div id="app" class="app"></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
